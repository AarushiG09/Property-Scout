# Nixpacks configuration for Railway deployment with Node.js and Python edge-tts
[providers]
providers = ["python", "node"]

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = ["npm install", "python3 -m pip install edge-tts"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
